name: Publish

on:
  push:
    branches:
      - master
      - next
      - '4.x.x'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CARBON_BOT_TOKEN }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify npm version (>= 11.5.1 required for OIDC)
        run: |
          NPM_VER=$(npm --version)
          echo "npm version: $NPM_VER"
          node -e "
            const [a,b,c] = '$NPM_VER'.split('.').map(Number);
            const [ra,rb,rc] = [11,5,1];
            const ok = a>ra || (a===ra && b>rb) || (a===ra && b===rb && c>=rc);
            if (!ok) { console.error('npm ' + '$NPM_VER' + ' is too old; need >= 11.5.1'); process.exit(1); }
          "

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            */*/node_modules
          key: ${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}

      - name: Install dependencies
        run: |
          yarn --frozen-lockfile
          yarn lerna run --stream postinstall

      - name: Build
        run: yarn build

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.CARBON_BOT_TOKEN }}
        run: yarn publish-npm
