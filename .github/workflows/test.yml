name: Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  react-jest-test:
    name: React Jest test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            react:
              - 'packages/react/**'

      - name: Increase watchers
        run: echo fs.inotify.max_user_watches=524288 | sudo tee -a /etc/sysctl.conf && sudo sysctl -p

      - name: Use Node.js
        uses: actions/setup-node@v4
        if: steps.changes.outputs.react == 'true'
        with:
          node-version: '22.x'

      - name: Cache dependencies
        uses: actions/cache@v4
        if: steps.changes.outputs.react == 'true'
        with:
          path: |
            node_modules
            */*/node_modules
          key: ${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}

      - name: Install dependencies
        if: steps.changes.outputs.react == 'true'
        run: |
          yarn --frozen-lockfile
          yarn lerna run --stream postinstall

      - name: Run Jest tests, collect coverage
        if: steps.changes.outputs.react == 'true'
        run: |
          cd packages/react
          yarn test:ci --silent

      - name: Archive coverage artifacts
        if: ${{ success() }} && steps.changes.outputs.react == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jest-coverage
          path: packages/react/jest/coverage/coverage-final.json

  react-cypress-test:
    name: React Cypress test
    if: false
    runs-on: ubuntu-latest
    container:
      image: cypress/browsers:node-22.21.0-chrome-141.0.7390.107-1-ff-144.0-edge-141.0.3537.92-1
      options: --privileged

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            */*/node_modules
          key: ${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: /root/.cache/Cypress
          key: cypress-${{ runner.os }}-cypress-${{ hashFiles('**/yarn.lock') }}

      - name: Install dependencies
        run: |
          yarn --frozen-lockfile
          yarn lerna run --stream postinstall
        env:
          CYPRESS_CACHE_FOLDER: /root/.cache/Cypress
          NODE_OPTIONS: --openssl-legacy-provider

      - name: Verify / install Cypress binary
        run: npx cypress install
        env:
          CYPRESS_CACHE_FOLDER: /root/.cache/Cypress

      - name: Run Cypress tests, collect coverage
        run: |
          cd packages/react
          yarn test:e2e:ci
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          CYPRESS_CACHE_FOLDER: /root/.cache/Cypress
          NODE_OPTIONS: --openssl-legacy-provider
          HEIGHT: 900
          WIDTH: 1680

      - name: Archive visual diff report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-report
          path: |
            packages/react/cypress-visual-report
            packages/react/cypress-visual-screenshots

      - name: Archive coverage artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: cypress-coverage
          path: packages/react/cypress/coverage/coverage-final.json

  combine-reports:
    name: Combine Coverage Reports
    runs-on: ubuntu-latest
    needs: [react-cypress-test, react-jest-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            react:
              - 'packages/react/**'

      - name: Use Node.js
        uses: actions/setup-node@v4
        if: steps.changes.outputs.react == 'true'
        with:
          node-version: '22.x'

      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4
        if: steps.changes.outputs.react == 'true'
        with:
          name: cypress-coverage
          path: ~/work/carbon-addons-iot-react/carbon-addons-iot-react/packages/react/cypress/coverage/

      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4
        if: steps.changes.outputs.react == 'true'
        with:
          name: jest-coverage
          path: ~/work/carbon-addons-iot-react/carbon-addons-iot-react/packages/react/jest/coverage/

      - name: Change file paths for cypress coverage report
        if: steps.changes.outputs.react == 'true'
        run: |
          cd packages/react/cypress/coverage
          pwd
          node ../../../../scripts/change-paths.js

      - name: Copy, combine, and report coverage
        if: steps.changes.outputs.react == 'true'
        run: |
          cd packages/react
          yarn reports

      - name: Coveralls
        uses: coverallsapp/github-action@master
        if: steps.changes.outputs.react == 'true'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: './packages/react/coverage/lcov.info'
          base-path: 'packages/react'

  test-angular:
    name: Test Angular
    runs-on: ubuntu-latest
    # The @ai-apps/angular package uses Angular 11 + ng-packagr 11 which requires Node 16.
    # Lerna v9 requires Node >=20, making it impossible to install dependencies for this
    # package via the monorepo root. Angular tests are skipped until the package is upgraded.
    if: false
    steps:
      - run: echo "Angular tests skipped pending Angular upgrade (incompatible with Node 20+)"
